[project]
name = "devTrackr"
version = "0.1.0"
description = "From commits to clock-ins. Your dev logbook, done for you."
readme = "../README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.17.0",
    "authlib>=1.6.9",
    "cryptography>=46.0.5",
    "fastapi[standard]>=0.119.1",
    "itsdangerous>=2.2.0",
    "passlib[bcrypt]>=1.7.4",
    # pin bcrypt to <4.0.0 because of passlib compatibility issues
    "bcrypt<4.0.0",
    "psycopg>=3.3.2",
    "pydantic-settings>=2.11.0",
    "pyjwt>=2.11.0",
    "python-dotenv>=1.1.1",
    "sqlalchemy>=2.0.44",
    "sqlmodel>=0.0.31",
    "tenacity>=9.1.2",
    "uvicorn[standard]>=0.38.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=1.19.1",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.14.1",
    "types-passlib>=1.7.7.20260211",
]


[tool.mypy]
plugins = ['pydantic.mypy']

strict = true
disable_error_code = ["unused-ignore"]

# Use explicit package bases and namespace packages to handle project structure
# without requiring __init__.py files in every directory.
explicit_package_bases = true
namespace_packages = true

# Ignore missing type hints from third-party libraries (like SQLModel/Alembic)
ignore_missing_imports = true

# Don't check the migration files or virtual environments
exclude = ["venv", ".venv", "alembic"]

[tool.pydantic-mypy]
# Catch trying to pass arguments to a Pydantic model that don't exist
init_forbid_extra = true
# Ensure the arguments you pass to a Pydantic model match the correct types
init_typed = true
# Warn if you are doing weird things with dynamic aliases
warn_required_dynamic_aliases = true


[tool.ruff]
line-length = 88
target-version = "py313"
extend-exclude = ["migrations"]

[tool.ruff.lint]
# Enable Ruff rules
# select = ["E", "F", "I", "UP"]
#   E = Pycodestyle errors
#   F = Pyflakes
#   I = Import sorting
#   UP = Modernization rules (use modern Python syntax)

select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "I",   # Import sorting
    "ARG001", # unused arguments in functions
]

ignore = [
    "B008",  # do not perform function calls in argument defaults
    "B904",  # Allow raising exceptions without from e, for HTTPException
    "E712",  # Allow equality comparisons to True/False for SQLModel/SQLAlchemy
]

[tool.ruff.format]
# Ensure Ruff respects Black formatting style
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning:passlib.*",
]
asyncio_default_fixture_loop_scope = "session"
