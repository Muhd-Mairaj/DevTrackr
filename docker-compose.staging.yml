# docker-compose.staging.yml
# Staging-specific overrides for DevTrackr.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.staging.yml up -d
#
# This file points services to published GHCR images, exposes staging ports,
# and renames containers so staging and production can coexist on one VPS.

services:
  database:
    container_name: devtrackr-${ENVIRONMENT}-database

  prestart:
    container_name: devtrackr-${ENVIRONMENT}-prestart
    image: ${BACKEND_IMAGE}
    pull_policy: always

  backend:
    container_name: devtrackr-${ENVIRONMENT}-backend
    image: ${BACKEND_IMAGE}
    pull_policy: always
    ports:
      - "127.0.0.1:${BACKEND_PORT}:8000"

  frontend:
    container_name: devtrackr-${ENVIRONMENT}-frontend
    image: ${FRONTEND_IMAGE}
    pull_policy: always
    ports:
      - "127.0.0.1:${FRONTEND_PORT}:80"
