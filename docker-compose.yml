name: "DevTrackr Services"

# x- extension to ensure required variables are present
# https://docs.docker.com/reference/compose-file/extension/
x-required-env:
  postgres:
    POSTGRES_USER: ${POSTGRES_USER?}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD?}
    POSTGRES_DB: ${POSTGRES_DB?}
  backend:
    DOMAIN: ${DOMAIN?}
    PROJECT_NAME: ${PROJECT_NAME?}
    FRONTEND_HOST: ${FRONTEND_HOST?}
    ENVIRONMENT: ${ENVIRONMENT?}
    SECRET_KEY: ${SECRET_KEY?}
    BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS?}
    ENCRYPTION_KEY: ${ENCRYPTION_KEY?}
    GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID?}
    GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET?}
  frontend:
    VITE_API_URL: ${VITE_API_URL?}

services:
  database:
    container_name: devtrackr-database
    image: postgres:18.1-trixie
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    volumes:
      - devtrackr-postgres-data:/var/lib/postgresql/data
    env_file: .env
    environment:
      - PGDATA=/var/lib/postgresql/data/pgdata

  prestart:
    container_name: devtrackr-prestart
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: prod
    restart: "no"
    depends_on:
      database:
        condition: service_healthy
    env_file: .env
    environment:
      - POSTGRES_HOST=database

    command: [ "./scripts/prestart.sh" ]

  backend:
    container_name: devtrackr-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: prod
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/utils/ping'); exit(0)",
        ]
      interval: 10s
      retries: 5
      start_period: 40s
      timeout: 10s
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
      prestart:
        condition: service_completed_successfully
    env_file: .env
    environment:
      - POSTGRES_HOST=database

  frontend:
    container_name: devtrackr-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: prod
    restart: unless-stopped
    env_file: .env
    # Port mapping is environment-specific:
    #   Dev:  docker-compose.override.yml maps 5173:5173 (Vite dev server)
    #   Prod: docker-compose.prod.yml maps 127.0.0.1:${FRONTEND_PORT}:80 (nginx)
    depends_on:
      backend:
        condition: service_healthy

volumes:
  devtrackr-postgres-data:
