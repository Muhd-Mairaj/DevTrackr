services:
  database:
    # expose port for local gui tools
    ports:
      - "${POSTGRES_PORT?Variable not set}:5432"

  prestart:
    build:
      target: dev
    develop:
      watch:
        - action: sync+restart
          path: ./backend/app/alembic/versions
          target: /app/app/alembic/versions

  backend:
    build:
      target: dev
    ports:
      - "8000:8000"
    develop:
      watch:
        - action: sync
          path: ./backend
          target: /app
          ignore:
            - ./backend/.venv
            - ./backend/__pycache__
        - action: rebuild
          path: ./backend/pyproject.toml

  frontend:
    build:
      target: dev
    ports:
      - "5173:5173"
    develop:
      watch:
        - action: sync
          path: ./frontend/src
          target: /app/src
        - action: rebuild
          path: ./frontend/package.json
