name: DevTrackr CI

on: [push, pull_request]

jobs:
  frontend-checks:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.8" # Match your Dockerfile

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Run Biome (Format & Lint)
        # Without --fix to prevent auto fix
        # run: bun run check
        run: bun biome ci .

      - name: Type Check (TypeScript)
        run: bun run tsc --noEmit

      - name: Test Build
        run: bun run build

  backend-checks:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install uv (The official Astral action is blazingly fast)
      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Dependencies
        run: uv sync --frozen

      - name: Check Formatting (Ruff)
        # --check tells Ruff to fail if files need formatting
        run: uv run ruff format --check .

      - name: Run Linter (Ruff)
        run: uv run ruff check .

  docker-checks:
    name: Docker Compose Build
    runs-on: ubuntu-latest
    needs: [frontend-checks, backend-checks]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker Images
        run: docker compose build
