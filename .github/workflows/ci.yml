name: DevTrackr CI

on:
  workflow_dispatch:
  push:
    branches: [dev, prod]
  pull_request:

jobs:
  frontend-checks:
    name: Frontend CI
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.27"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Generate disposable encryption key
        # Config requires a valid Fernet key at import time; CI uses a per-run value.
        run: |
          echo "ENCRYPTION_KEY=$(python3 -c 'import base64, os; print(base64.urlsafe_b64encode(os.urandom(32)).decode())')" >> "$GITHUB_ENV"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.8" # Match your Dockerfile

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Run Biome (Format & Lint)
        # Without --fix to prevent auto fix
        # run: bun run check
        run: bun biome ci .

      - name: Generate API Client
        working-directory: .
        env:
          PROJECT_NAME: DevTrackr
          ENVIRONMENT: development
          SECRET_KEY: dummy_secret_key
          POSTGRES_HOST: localhost
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: dummy_password
          POSTGRES_DB: devtrackr_db
          GITHUB_CLIENT_ID: dummy_client_id
          GITHUB_CLIENT_SECRET: dummy_client_secret
          GITHUB_PRIVATE_KEY_PATH: /tmp/dummy.pem
          GITHUB_APP_SLUG: devtrackr-test
        run: |
          (cd backend && uv sync --frozen)
          ./scripts/generate-client.sh

      - name: Type Check (TypeScript) & Test Build
        run: bun run build

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.27"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Generate disposable encryption key
        # Config requires a valid Fernet key at import time; CI uses a per-run value.
        run: |
          echo "ENCRYPTION_KEY=$(python3 -c 'import base64, os; print(base64.urlsafe_b64encode(os.urandom(32)).decode())')" >> "$GITHUB_ENV"

      - name: Generate OpenAPI Spec
        env:
          PROJECT_NAME: DevTrackr
          ENVIRONMENT: development
          SECRET_KEY: dummy_secret_key
          POSTGRES_HOST: localhost
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: dummy_password
          POSTGRES_DB: devtrackr_db
          GITHUB_CLIENT_ID: dummy_client_id
          GITHUB_CLIENT_SECRET: dummy_client_secret
          GITHUB_PRIVATE_KEY_PATH: /tmp/dummy.pem
          GITHUB_APP_SLUG: devtrackr-test
        run: |
          cd ../backend
          uv sync --frozen
          uv run generate_openapi.py
          cp openapi.json ..

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.8"

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Run Unit Tests (Vitest)
        run: bun run test:unit

  backend-checks:
    name: Backend CI
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # Install uv (The official Astral action is blazingly fast)
      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.27"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Dependencies
        run: uv sync --frozen

      - name: Check Formatting (Ruff)
        # --check tells Ruff to fail if files need formatting
        run: uv run ruff format --check .

      - name: Run Linter (Ruff)
        run: uv run ruff check .

      - name: Type Check (mypy)
        run: uv run mypy .

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:18.1-trixie
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: ${{ secrets.TEST_POSTGRES_PASSWORD }}
          POSTGRES_DB: devtrackr_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.27"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Generate disposable encryption key
        # Config requires a valid Fernet key at import time; tests use a per-run value.
        run: |
          echo "ENCRYPTION_KEY=$(python3 -c 'import base64, os; print(base64.urlsafe_b64encode(os.urandom(32)).decode())')" >> "$GITHUB_ENV"

      - name: Install PostgreSQL Client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Create Test Database
        run: |
          PGPASSWORD=${{ secrets.TEST_POSTGRES_PASSWORD }} psql -h localhost -U admin -d postgres -c "CREATE DATABASE devtrackr_db_test;"

      - name: Install Dependencies
        run: |
          cd backend
          uv sync --frozen

      - name: Run Backend Tests
        run: |
          cd backend
          uv run pytest -v --tb=short
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: ${{ secrets.TEST_POSTGRES_PASSWORD }}
          POSTGRES_DB: devtrackr_db
          SECRET_KEY: changeme
          ENVIRONMENT: development
          PROJECT_NAME: DevTrackr
          GITHUB_CLIENT_ID: dummy_client_id
          GITHUB_CLIENT_SECRET: dummy_client_secret
          GITHUB_PRIVATE_KEY_PATH: /tmp/dummy.pem
          GITHUB_APP_SLUG: devtrackr-test

  docker-checks:
    name: Docker Compose Build
    runs-on: ubuntu-24.04
    needs: [frontend-checks, frontend-tests, backend-checks, backend-tests]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Generate disposable encryption key
        # Config requires a valid Fernet key at build time; CI uses a per-run value.
        run: |
          echo "ENCRYPTION_KEY=$(python3 -c 'import base64, os; print(base64.urlsafe_b64encode(os.urandom(32)).decode())')" >> "$GITHUB_ENV"

      - name: Build Docker Images
        # These environment variables are used only for GitHub Actions testing, safe to commit
        env:
          PROJECT_NAME: DevTrackr

          DOMAIN: localhost
          FRONTEND_HOST: http://localhost:5173

          # Environment: development, staging, production
          ENVIRONMENT: staging

          BACKEND_CORS_ORIGINS: "http://localhost,http://localhost:5173,https://localhost,https://localhost:5173"
          # can be generated with openssl rand -hex 16
          SECRET_KEY: changeme

          # Database settings
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: devtrackr_db
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432

          # Frontend
          VITE_API_URL: http://localhost:8000

          # GitHub OAuth (dummy values — not used at build time)
          GITHUB_CLIENT_ID: dummy_client_id
          GITHUB_CLIENT_SECRET: dummy_client_secret

          # Brevo Email settings
          # SMTP_PORT:
          # SMTP_HOST:
          # SMTP_LOGIN:
          # SMTP_API_KEY:
          # EMAILS_FROM_EMAIL:
          # EMAILS_FROM_NAME:

        run: docker compose build
