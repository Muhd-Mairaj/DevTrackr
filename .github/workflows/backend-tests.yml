name: Backend Tests

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18.1-trixie
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: ${{ secrets.TEST_POSTGRES_PASSWORD }}
          POSTGRES_DB: devtrackr_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "backend/.python-version"

      - name: Install PostgreSQL Client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Create Test Database
        run: |
          PGPASSWORD=${{ secrets.TEST_POSTGRES_PASSWORD }} psql -h localhost -U admin -d postgres -c "CREATE DATABASE devtrackr_db_test;"

      - name: Install Dependencies
        run: |
          cd backend
          uv sync --frozen

      - name: Run Backend Tests
        run: |
          cd backend
          uv run pytest -v --tb=short
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: ${{ secrets.TEST_POSTGRES_PASSWORD }}
          POSTGRES_DB: devtrackr_db
          SECRET_KEY: changeme
          ENCRYPTION_KEY: ${{ secrets.TEST_ENCRYPTION_KEY }}
          ENVIRONMENT: development
          PROJECT_NAME: DevTrackr
          # GitHub App/OAuth - dummy values
          GITHUB_CLIENT_ID: dummy_client_id
          GITHUB_CLIENT_SECRET: dummy_client_secret
          GITHUB_PRIVATE_KEY_PATH: /tmp/dummy.pem
          GITHUB_APP_SLUG: devtrackr-test
