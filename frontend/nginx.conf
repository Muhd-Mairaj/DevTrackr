server {
    listen 80;

    # Serve React Static Files
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html; # Support React Router
    }

    # Proxy API requests to the Backend Container
    location /api/ {
        proxy_pass http://backend:8000; # "backend" matches the service name in docker-compose
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto; # pass Caddy's scheme (https) through
    }
}
